name: Publish Chess Academy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Set up Node.js for functional regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run chess rules and website smoke tests
        run: node tests/smoke.cjs
      - name: Test account lifecycle and cloud sync conflicts
        run: node tests/accounts.cjs
      - name: Verify persistent account sync and conflict protection
        run: node tests/account-resume.cjs
      - name: Verify Stockfish UCI integration (report separately)
        id: stockfish_check
        continue-on-error: true
        timeout-minutes: 3
        run: node tests/uci-wrapper.cjs
      - name: Summarize Stockfish engine check
        if: always()
        run: |
          echo "Stockfish UCI check: ${{ steps.stockfish_check.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.stockfish_check.outcome }}" != "success" ]; then
            echo "The static site will still deploy. Inspect the UCI step for engine-runtime problems; browser Stockfish QA remains required." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
